<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>词库 · CET-4 作战台</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#161412">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="mark"></span>CET-4 作战台<span class="brand-sub">WORKBENCH</span></a>
  <nav class="top-tabs" aria-label="导航">
    <a href="index.html" class="tab-link" data-page="index">背词</a>
    <a href="plan.html" class="tab-link" data-page="plan">计划</a>
    <a href="stats.html" class="tab-link" data-page="stats">统计</a>
  </nav>
</header>

<main class="narrow">
  <div class="sec-head"><h2>选择词库</h2><div class="rule"></div></div>
  <p class="page-note">全部词库来自百词斩官方词书数据（github.com/kajweb/dict 开源项目），释义、音标、例句与真题均为原始收录内容。每个词库的背诵进度独立保存，随时切换。</p>
  <div class="bank-cards" id="bankCards"></div>

  <div class="box quota-box">
    <div class="quota-title">每日新词上限</div>
    <div class="quota-row">
      <input type="number" id="quotaInput" min="1" max="200" step="1" inputmode="numeric">
      <span class="modal-note" style="margin:0;">个 / 天 · 到期复习词不受此限</span>
      <button class="btn btn-red btn-sm" id="quotaSave">保存</button>
    </div>
    <p class="modal-note">修改后当天立即按新配额刷新队列；各词库共用此设置。</p>
  </div>

  <div class="box quota-box">
    <div class="quota-title">每日复习上限</div>
    <div class="quota-row">
      <input type="number" id="reviewCapInput" min="10" max="500" step="10" inputmode="numeric">
      <span class="modal-note" style="margin:0;">个 / 天 · 超出的到期词自动顺延到明天</span>
      <button class="btn btn-red btn-sm" id="reviewCapSave">保存</button>
    </div>
    <p class="modal-note">防止复习积压雪球：今天没轮到的词明天会优先出现，不会丢失。</p>
  </div>

  <div class="box quota-box">
    <div class="quota-title">数据备份</div>
    <p class="modal-note" style="margin-bottom:10px;">进度保存在本浏览器中。换设备或清缓存前请先导出备份文件，再到新设备导入。</p>
    <div class="quota-row">
      <button class="btn btn-teal btn-sm" id="exportBtn">导出备份</button>
      <button class="btn btn-blue btn-sm" id="importBtn">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none;">
      <span class="mono" id="backupInfo" style="font-size:.75rem;color:var(--muted);"></span>
    </div>
  </div>
</main>

<nav class="tabbar" aria-label="主导航">
  <a href="index.html" class="tab-btn" data-page="index">单词</a>
  <a href="plan.html" class="tab-btn" data-page="plan">计划</a>
  <a href="banks.html" class="tab-btn" data-page="banks">词库</a>
  <a href="stats.html" class="tab-btn" data-page="stats">统计</a>
</nav>

<div id="toast"></div>

<script src="js/bank-core.js"></script>
<script src="js/bank-freq.js"></script>
<script src="js/bank-exam.js"></script>
<script src="js/bank-full.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/banks.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js")})}</script>
</body>
</html>
